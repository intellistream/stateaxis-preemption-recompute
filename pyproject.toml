[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-preemption-recompute"
version = "0.2.0"
description = "Experimental generation-safe StateAxis preemption and recompute policy"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-preemption-recompute" = "stateaxis_preemption_recompute"

[project.entry-points."stateaxis.mod_handlers"]
preemption_recompute = "stateaxis_preemption_recompute:preemption_recompute"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_preemption_recompute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
